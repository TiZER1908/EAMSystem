global
    maxconn 1000
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect 4s
    timeout server  30m
    timeout check   5s

# --- Статистика (удобно для скриншотов в ВКР) ---
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    # Доступ к статистике без пароля (только для локальной разработки!)
    stats admin if TRUE

# --- Порт для ЗАПИСИ (только Leader) ---
# Приложение будет писать сюда. HAProxy направит трафик только на pg1.
listen primary
    bind *:5000
    # Проверка через REST API Patroni
    option httpchk OPTIONS /primary
    http-check expect status 200
    # Настройка поведения при падении узла
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    # Список серверов (порт 5432 для PG, порт 8008 для проверки Patroni)
    server pg1 pg1:5432 maxconn 100 check port 8008
    server pg2 pg2:5432 maxconn 100 check port 8008
    server pg3 pg3:5432 maxconn 100 check port 8008

# --- Порт для ЧТЕНИЯ (все реплики) ---
# Если захочешь разгрузить лидера, направишь SELECT-запросы сюда.
listen replicas
    bind *:5001
    option httpchk OPTIONS /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 maxconn 100 check port 8008
    server pg2 pg2:5432 maxconn 100 check port 8008
    server pg3 pg3:5432 maxconn 100 check port 8008
