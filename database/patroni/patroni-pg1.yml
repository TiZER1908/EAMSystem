scope: eam-cluster
name: pg1 

restapi:
  listen: 0.0.0.0:8008
  connect_address: pg1:8008 

etcd3:
  hosts: etcd1:2379,etcd2:2379,etcd3:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: pg1:5432 
  data_dir: /var/lib/postgresql/18/docker
  authentication:
    replication:
      username: replicator
      password: rep-pass
    superuser:
      username: postgres
      password: postgres
  parameters:
    max_wal_senders: 10
    max_replication_slots: 10
    wal_level: replica